<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doomscroll AI</title>
  <meta name="description" content="You ARE the algorithm. A classroom game about how recommender systems work.">
  <!-- An emoji as the tab icon, inline, so there is nothing extra to load (works from file://). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📱%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript>
    <p class="noscript">Doomscroll AI needs JavaScript. Please turn it on in your browser, then reload this page.</p>
  </noscript>

  <main id="app">

    <!-- Only one .screen is visible at a time. ui.showScreen('name') shows #screen-name. -->

    <section id="screen-title" class="screen">
      <!-- Decoration only: the six topics drift around behind the card. -->
      <div class="title-bg" aria-hidden="true">
        <span style="--x: 7%;  --y: 14%; --d: 0s">⚽</span>
        <span style="--x: 84%; --y: 10%; --d: -1.5s">💃</span>
        <span style="--x: 14%; --y: 70%; --d: -3s">🎵</span>
        <span style="--x: 88%; --y: 66%; --d: -4.5s">💥</span>
        <span style="--x: 42%; --y: 6%;  --d: -2.2s">🎬</span>
        <span style="--x: 60%; --y: 84%; --d: -0.8s">🍕</span>
      </div>
      <div class="title-card">
        <div class="title-card__emoji" aria-hidden="true">📱</div>
        <h1>Doomscroll AI</h1>
        <p class="title-card__pitch">You ARE the algorithm.</p>
        <p class="title-card__sub">Pick posts. Keep people scrolling. See what happens.</p>
        <ol class="how">
          <li><span class="how__icon" aria-hidden="true">👆</span>Show people posts</li>
          <li><span class="how__icon" aria-hidden="true">👀</span>Watch how they react</li>
          <li><span class="how__icon" aria-hidden="true">⏱️</span>Don't let anyone leave</li>
        </ol>
        <button id="btn-start" class="btn btn--primary btn--big" type="button">Start</button>
        <p class="title-card__fine">About 3 minutes. No sign-in. No names.</p>
      </div>
    </section>

    <section id="screen-tutorial" class="screen">
      <header class="tut-header">
        <p id="tut-step" class="tut-header__step"></p>
        <h2 id="tut-title" class="tut-header__title"></h2>
        <p id="tut-text" class="tut-header__text"></p>
        <p id="tut-goal" class="goal-pill"></p>
      </header>
      <div id="tut-card-slot" class="tut-slot"></div>
      <button id="btn-skip" class="link-btn" type="button">Skip tutorial</button>
    </section>

    <!-- The main game: a scoreboard bar on top, six profile cards (3 x 2) below. -->
    <section id="screen-main" class="screen">
      <header class="hud">
        <div id="hud-clock" class="hud__timer" role="timer" aria-label="Time left">
          <span id="hud-time" class="hud__clock">1:30</span>
          <span class="hud__clock-label">left</span>
        </div>
        <div class="hud__stats">
          <p class="hud__stat"><span>still scrolling</span><strong id="hud-still">6 / 6</strong></p>
          <p class="hud__stat"><span>average attention</span><strong id="hud-avg">60</strong></p>
        </div>
        <button id="btn-pause" class="btn btn--ghost btn--big" type="button">⏸ Pause</button>
      </header>
      <div class="timebar" aria-hidden="true"><div id="hud-timebar" class="timebar__fill"></div></div>
      <div id="main-grid" class="board"></div>
    </section>

    <!-- The results: a score first, then one step per person, then the big picture (reveal.js). -->
    <section id="screen-reveal" class="screen">
      <nav id="reveal-steps" class="steps" aria-label="Results steps"></nav>
      <div id="reveal-stage" class="stage" tabindex="-1"></div>
      <footer class="stage-nav">
        <button id="reveal-back" class="btn btn--ghost" type="button">← Back</button>
        <span id="reveal-progress" class="stage-nav__progress"></span>
        <button id="reveal-next" class="btn btn--primary" type="button">Next →</button>
      </footer>
    </section>

  </main>

  <!-- A big message over the board, e.g. "Time's up!" -->
  <div id="banner" class="banner" hidden><span id="banner-text"></span></div>

  <!-- One shared pop-up: tutorial results, the "ready?" card, and pause. -->
  <div id="overlay" class="overlay" hidden>
    <!-- Spotlight: when a pop-up points at something, this ring sits over it and dims everything else. -->
    <div id="overlay-spot" class="overlay__spot" hidden></div>
    <div class="overlay__panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <div id="overlay-buttons" class="overlay__buttons"></div>
    </div>
  </div>

  <!--
    Classic scripts, in dependency order. No ES modules, so this works when you double-click
    the file (file://). Model first (no DOM), then the logger, then the screen code, and last
    the game that wires them together.
  -->
  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/vp.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
